name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Supabase CLI (optional, if configured)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx supabase --version || true
          # Migration tests run against a local Supabase instance in CI.
          # Requires SUPABASE_ACCESS_TOKEN to be configured in repo secrets.
          # npx supabase start
          # npx supabase db reset
          # npm test
